# 가치가 인스타 분석 서버 (Cloudflare Workers 무료 요금제)
# 올리기: cd worker && npx wrangler deploy
name = "gachiga-ig"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Workers AI: 무료 요금제는 하루 무료 한도를 넘으면 요청이 실패할 뿐, 돈이 나가지 않아요.
[ai]
binding = "AI"

# 요청 결과 기록(무료 요금제 포함). 대시보드 > Workers > gachiga-ig > Logs에서 볼 수 있어요.
[observability]
enabled = true

# 한국어로 옮긴 낱말(渋谷区 → 시부야구)을 모두가 같이 쓰도록 모아 두는 곳(무료 요금제 KV).
[[kv_namespaces]]
binding = "KO_WORDS"
id = "c8645352310f4373a8222dc223f510f3"
